[backdrop]
enabled = true

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[location]
auto_locate = true

[nightlight]
enabled = true

[notification]
position = "top_center"

[osd.kinds]
lock_keys = false

[shell]
screen_time_enabled = true

    [shell.panel]
    transparency_mode = "glass"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

