[backdrop]
enabled = true

[bar.default]
background_opacity = 0.5
capsule = true
center = [ "workspaces", "clock", "notifications" ]
end = [
    "tray",
    "clipboard",
    "caffeine",
    "wallpaper",
    "network",
    "bluetooth",
    "volume",
    "input_volume",
    "battery",
    "session",
    "control-center"
]
margin_edge = 10
margin_ends = 10
shadow = false
start = [ "group:g1", "active_window", "media" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "dark_mode"

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 2560.0
    cy = 1258.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 1081.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "niri", "qt" ]

[wallpaper]
per_monitor_directories = true
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/lukas/Pictures/Wallpapers/DP-2/wallhaven-e8wejo_5120x1440.png"

    [wallpaper.last]
    path = "/home/lukas/Pictures/Wallpapers/DP-2/wallhaven-yqg6r7_5120x1440.png"

    [wallpaper.monitor.DP-2]
    directory = "/home/lukas/Pictures/Wallpapers/DP-2"

    [wallpaper.monitor.eDP-1]
    directory = "/home/lukas/Pictures/Wallpapers/eDP-1"

    [wallpaper.monitors.DP-2]
    path = "/home/lukas/Pictures/Wallpapers/DP-2/wallhaven-yqg6r7_5120x1440.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/lukas/Pictures/Wallpapers/eDP-1/wallhaven-po7l8j_1920x1200.png"

[widget.clock]
format = "{:%d. %b %H:%M}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false
vpn_status = "both"
